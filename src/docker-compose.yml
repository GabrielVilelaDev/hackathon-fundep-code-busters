version: '3.8'

services:
  projetos-api:
    build:
      context: ./back/Hackathon.IniciarProjeto/
      dockerfile: iniciarProjeto-dockerfile
    container_name: fundep-projetos-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - TZ=America/Sao_Paulo
      - ENABLE_SWAGGER=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - fundep-network
    labels:
      - "com.fundep.service=projetos-api"
      - "com.fundep.version=1.0.0"
      - "com.fundep.description=Sistema de Gerenciamento de Projetos FUNDEP"

  inscricao-evento-api:
    build:
      context: ./back/Hackathon.InscricaoEvento/
      dockerfile: inscricaoEvento-dockerfile
    container_name: fundep-inscricao-evento-api
    ports:
      - "8081:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - TZ=America/Sao_Paulo
      - ENABLE_SWAGGER=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - fundep-network
    labels:
      - "com.fundep.service=inscricao-evento-api"
      - "com.fundep.version=1.0.0"
      - "com.fundep.description=Sistema de Inscrição em Eventos FUNDEP"

networks:
  fundep-network:
    driver: bridge
    name: fundep-network